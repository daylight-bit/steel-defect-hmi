<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缺陷检测 HMI 演示</title><style>body{margin:0;background:#0b1220;color:#e8f0f7;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:980px;margin:36px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26364b;padding-bottom:18px}h1{font-size:32px;margin:0;color:#fff}.sub{color:#8fa9bf}.card{background:#121f30;border:1px solid #294059;border-radius:14px;padding:22px;margin-top:20px}button,select,input{background:#1d344b;color:#eef;border:1px solid #3c6682;border-radius:8px;padding:10px 14px;font-size:15px}button{cursor:pointer;background:#168c87;border-color:#2bbeb3}button:hover{filter:brightness(1.15)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#10263a;padding:14px;border-radius:10px}.metric b{display:block;font-size:25px;color:#4de0cc;margin-top:5px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.step{padding:10px 12px;border-radius:8px;background:#203349;color:#aac2d4}.step.on{background:#168c87;color:#fff}.log{min-height:80px;color:#a9c8d7;white-space:pre-line}@media(max-width:680px){.grid{grid-template-columns:1fr}h1{font-size:25px}}</style><main><div class="top"><div><h1>缺陷检测 HMI 演示</h1><div class="sub">脱敏 Mock · 交互状态实验</div></div><span>运行模式：<b id="mode">离线演示</b></span></div><section class="card"><h2>检测图像</h2><div class="grid"><div class="metric">当前缺陷<b id="defect">DF-001</b></div><div class="metric">置信度<b id="score">0.85</b></div><div class="metric">任务状态<b id="state">待处理</b></div></div><div class="steps"><div class="step on" id="s1">载入图像</div><div class="step" id="s2">选中缺陷</div><div class="step" id="s3">重建请求</div><div class="step" id="s4">结果展示</div></div><button onclick="next()">推进任务状态</button> <button onclick="selectDefect()">切换缺陷</button><div class="log" id="log">演示样本已载入。页面状态与任务对象绑定。</div></section><script>let i=0,n=1;function next(){i=Math.min(3,i+1);['s1','s2','s3','s4'].forEach((x,j)=>document.getElementById(x).classList.toggle('on',j===i));let a=['待处理','已选中','重建中','结果就绪'];document.getElementById('state').textContent=a[i];document.getElementById('log').textContent=['等待选择缺陷对象','已绑定 DF-'+String(n).padStart(3,'0'),'后台任务运行中，界面保持可响应','结果与当前样本对应'][i]}function selectDefect(){n=n%4+1;document.getElementById('defect').textContent='DF-'+String(n).padStart(3,'0');i=1;next()}</script></main></html>
